services:
  postgres:
    image: postgres:16-alpine
    container_name: qazrem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qazrem}
      POSTGRES_USER: ${POSTGRES_USER:-qazrem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qazrem_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qazrem} -d ${POSTGRES_DB:-qazrem}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
